[package]
name = "stopa-app"
description = "The phone app: Leptos UI, camera scanning, offline support."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
stopa-core = { path = "../core", default-features = false, features = ["qr"] }
leptos = { version = "0.8", features = ["csr"] }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "CacheStorage",
    "CanvasRenderingContext2d",
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomException",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlLinkElement",
    "HtmlVideoElement",
    "History",
    "ImageData",
    "Location",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MessageEvent",
    "Navigator",
    "RegistrationOptions",
    "ServiceWorker",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "ServiceWorkerUpdateViaCache",
    "Storage",
    "StorageEvent",
    "Window",
]

[build-dependencies]
stopa-core = { path = "../core" }
serde_json = { workspace = true }
