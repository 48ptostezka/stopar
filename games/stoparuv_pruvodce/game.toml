„Župan!“ Hromotluk zrudne. „Našel jsem ho kdesi na cestách. Na štítku stálo: Majetek AD, prát na čtyřicet stupňů.
Odhazování odpadků ve vesmíru, prosím pěkně!“

„Odnesl jsem ho do galaktických Ztrát a nálezů a on se tam ztratil. Takže teď bude ve Ztrátách a nálezech ze Ztrát a nálezů.
A ty jsou obrovské! Jestli ho najdete, vyřiďte mu, že na něj mám stížnost.“
"""
