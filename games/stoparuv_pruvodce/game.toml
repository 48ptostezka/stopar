Pak se do sebe zamilovali. Vlastně se to dalo čekat. Klasický motiv ‚enemies to lovers‘.

Blátotlačka se vplíží dovnitř a schoulí se mu k nohám. Teda, schoulí je silné – vlastně slabé – slovo.
Zaplní celou jeskyni a Lejstrbach zmizí někde pod jejím zubem. Nevadí mu to.
