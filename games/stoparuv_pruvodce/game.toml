Pozdravíte. Húlúvú je modrý.

Zeptáte se, jestli vám rozumí.

Húlúvú je pořád modrý. Pak je chvíli modrý pořád stejně. Pak zase modrý. A modrý. Modrý? Modrý. A ještě modrý.

Možná odpovídá. Ale jak, nemáte ponětí.
"""
text.en = "X"
