„Pondělismus! Škola ctihodného Ublížeje Týdenního! Myslel jsem, že už ho nikdo nezná!“

„Ublížej tvrdil, že zlo vůbec není v bytostech, ale v čase. Konkrétně v pondělí. Na důkaz shromáždil
statistiky všech zločinů Galaxie a zjistil, že většina se stala buď v pondělí, nebo v den, který se jako
pondělí tvářil. Několik planet na jeho popud pondělí zrušilo. Zlo se okamžitě přestěhovalo na úterý.“

„Ublížej to označil za nejdůležitější objev své kariéry: zlo nelze zničit, lze ho jen přeplánovat.
Zbytek života strávil vyjednáváním, aby se přesunulo na jedno konkrétní úterý v roce 4 525 362.
Prý se to skoro povedlo.“

„Upřímně, já jsem taky pondělista. Jen to neříkejte nahlas.“
