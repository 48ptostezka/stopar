[locations.museum_of_grey.scenes.rename]
text.cs = """
Navrhnete ředitelce, ať virus nechá být. Když všechny odstíny vypadají stejně, stačí muzeum přejmenovat na Muzeum jedné šedi.

Ředitelka se zamyslí. Pak se pro jistotu zamyslí ještě jednou. „To by bylo... ještě nudnější,“ řekne nakonec.
Nikdo nepropukne v jásot, protože se to tady nesluší, ale je cítit, že atmosféra nudy se přece jen trochu změnila.

Virus tedy vyhrál. Ale muzeum taky. A vy taky. Win, win, win. Dobrá zpráva, vesmír není hra s nulovým součtem.

Z vděčnosti vám ředitelka věnuje kachličku ze sbírky. Vypadá úplně stejně jako všechny ostatní.
Na zadní straně má ale štítek: katalogové číslo 23874834, odstín kovové slepičí vajíčko.
"""
