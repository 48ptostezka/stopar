to = "what_question"


[locations.snail_station.scenes.what_question]
text.cs = """
„Aha.“ Húlúvú chvíli rozpačitě bliká. „A na co se tedy chcete zeptat?“
"""
text.en = "X"
image = "huluvu_hranol.svg"
alt = { cs = "Hranol rozkládá húlúvú na jednotlivé barvy duhy.", en = "X" }

[[locations.snail_station.scenes.what_question.choices]]
