[locations.museum_of_grey.scenes.virus]
text.cs = """
Zaměstnanci lomí rukama a tiše pláčou do šedých kapesníků.

Dozvíte se, že muzeum napadl počítačový virus. Počítače tu sice vůbec nemají, ale to viru nikdo neřekl.
Nejprve napadl kartotéku, pak razítka a nakonec i starého kustoda.

A pak zašifroval všech patnáct tisíc odstínů. Teď vypadají úplně stejně. Návštěvníci si ničeho nevšimli.
Nebo spíše: návštěvníci by si ničeho nevšimli, i kdyby tu nějací byli.

Kustod stojí uprostřed sálu a nehýbe se. Když se přiblížíte, otevře ústa a ozve se z nich plechový hlas.

„CHYBA 404: ODSTÍN NENALEZEN. Muzeum je pod mou kontrolou. Odstraní mě jedině logický paradox. Na ten ale nemáte.“
"""
