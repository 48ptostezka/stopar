Bogdan ztuhne. „Minuta? Tu tu pár hodin zpátky hledali Vogoni. Postavili si kvůli tomu vlastní frontu a jeden a půl hodiny v ní čekali.
Jinak to neumějí. Pak řekli, že pokud si na něco vzpomenu, mám jim dát vědět. To tak.“

Zamžourá na vás. „Vy ale nevypadáte jako Vogoni. Tak vám něco řeknu. Tu minutu si vypůjčil můj kamarád,
