Chtěl ji vrátit dřív, než si toho někdo všimne, ale trošku se to protáhlo.“

„Teď po něm jde časová policie, Úřad pro měření času a Svaz lidí, kterým dnes ujel vlak přesně o minutu.
Ti jsou nejhorší.“

