Hromotluk sedí uprostřed hory šanonů a rozzáří se, jakmile vás uvidí. Je to první bytost v mlhovině, která z vás má radost.

„My Reklamači sbíráme stížnosti na vesmír už čtyři sta let. Máme jich teď něco přes čtyři miliardy osm set milionů.
Od konkrétních věcí typu ‚23. října jsem zmokl a nachladil se a nemohl jsem jet na koncert, na který jsem se těšil‘ až po trochu obecnější ‚gravitace‘.
Chceme podat hromadnou žalobu.“

Posmutní. „Jenže podle Vogonů nemá vesmír provozovatele ani adresu. Vy náhodou nevíte, kam to poslat?“
"""
text.en = "X"
image = "hromotluk.svg"
alt = { cs = "Hromotluk Reklamač Sedmý se nad vámi sklání se stížností.", en = "X" }
