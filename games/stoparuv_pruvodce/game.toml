V hale za dveřmi sedí na krabici profesor Fiflík a vypadá unaveně. Ostatně, jako každý rodič.
Jako na ostatních předmětech ve Ztrátách a nálezech je i na něm cedulka – profesor, jeden kus, značně opotřebený.

„Potřeboval jsem minutu navíc, abych stihl odevzdat disertaci,“ šeptá. „Ale když jsem se podíval dovnitř, našel jsem
tam šedesát osiřelých sekund. Tak jsem v té minutě zůstal a třináct let se o ně staral. Teď jsou z nich puberťačky.“

Čas se kolem něj chová divně. Hodiny na zdi chvíli jdou, chvíli trucovitě stojí. A kdykoli profesor promluví,
jeho slova dorazí o sekundu později. Sekundy se za něj stydí.

„Kdybych tak měl jinou minutu,“ povzdechne si. „Minuta je minuta. Nikdo by rozdíl nepoznal.“

„Jinou minutu?“ Bogdan se rozzáří. „Vždyť tu máme celé oddělení ztraceného času!“
"""
