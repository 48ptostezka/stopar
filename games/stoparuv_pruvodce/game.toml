[locations.lost_from_lost_and_found.scenes.fashion]
text.cs = """
Župan sem dorazil dnes kolem půl druhé. Ve dvě ho zahlédla první módní influencerka. O půl třetí už ho kopírovaly
všechny krejčovské dílny civilizace. Ve tři ho módní týdeník Ztracený styl prohlásil za trend sezóny
a módní kritici začali psát o „odvážném návratu k domácí pohodlnosti“.

Teď už se nikdo, kdo nemá župan, ani nemůže ukázat na ulici. Nejbohatší obyvatelé nosí tři přes sebe.

U stánku s kopiemi postává prodavač. „Kopírujeme do posledního stehu,“ chlubí se. „Štítek, skvrny, ošoupané lokty.
Všechno jako originál. Jen kapsy necháváme prázdné. Kdo by kopíroval, co má kdo v kapsách?“
"""
text.en = "X"
image = "ztraty_ztrat_zupany.svg"
alt = { cs = "Všichni obyvatelé nosí župany stejné jako Arthur.", en = "X" }
pick = "any"

[[locations.lost_from_lost_and_found.scenes.fashion.choices]]
id = "pockets"
label = { cs = "Prohledávat kapsy kolemjdoucích", en = "X" }
to = "pockets_1"

[locations.lost_from_lost_and_found.scenes.pockets_1]
text.cs = """
Začnete zdvořile žádat kolemjdoucí, jestli by vám ukázali kapsy. Většina je ráda, že se jich někdo všímá.

První kapsa: prázdná. Druhá kapsa: prázdná. Třetí kapsa: provázek, na jehož druhém konci je skříň.
"""
text.en = "X"
image = "ztraty_ztrat_zupany.svg"
alt = { cs = "Všichni obyvatelé nosí župany stejné jako Arthur.", en = "X" }
next = "pockets_2"

[locations.lost_from_lost_and_found.scenes.pockets_2]
text.cs = """
Čtyřstá kapsa: prázdná. Tisící kapsa: prázdná, ale velmi hezky ušitá.

Pak narazíte na nenápadného pána v trochu ošoupaném županu. V pravé kapse má použitý sáček čaje.
"""
text.en = "X"
image = "ztraty_ztrat_zupany.svg"
alt = { cs = "Všichni obyvatelé nosí župany stejné jako Arthur.", en = "X" }
next = "original"


[locations.lost_from_lost_and_found.scenes.original]
text.cs = """
Pán se zastydí. „To je ten vadný kus. Pořád v něm byl ten sáček a nešel vyndat. Teď je trochu trapně zastaralý. Jako z minulé hodiny.“

Když se ho zeptáte, jestli by vám ho dal, svolí. Odváže si župan od zápěstí a podá vám ho. Pak si okamžitě koupí novou kopii. Bez sáčku.

Gratuluji. Našli jste Arthurův župan. Vraťte se do Srdce ze zlata. Po cestě ještě můžete navštívit další lokace.

„Počkat, neměli jsme najít Arthura?“

„To neřeš. Hlavně, že je konec.“
"""
text.en = "X"
image = "ztraty_ztrat_arthuruv_zupan.svg"
alt = { cs = "Rozpačitě vypadající pán oblečený v Arthurově županu.", en = "X" }
give = { items = { arthurs_bathrobe = 1 }, clues = ["bathrobe_found"] }

