text.cs = """
Ve frontě stojíte osm hodin. Za tu dobu stihne vzplanout válečný konflikt se sousední frontou na toalety.
Mírová jednání jsou komplikovaná, neboť zástupci obou front se nemohou setkat. Přišli by totiž o místo.

Nakonec se dostanete na řadu. Podáte formulář. A kachličku.

Vogon přečte štítek. „Kovové slepičí vajíčko,“ zašeptá a oči se mu zalijí slzami. Tak nudnou věc ještě nikdy nedostal.

Žádost vyřídí okamžitě. Prolistuje šanony za celý týden. Pak za celý rok. Pak za celé tisíciletí.
Jen tak pro jistotu. Jediný šanon, který vynechá, je nadepsaný MYŠI.

„Žádost o schválení únosu? Nikdo. Nikdy.“

Najde jen jednu zajímavou žádost z minulého týdne.
Hromotluk Reklamač Sedmý z Nespokojené mlhoviny chce vědět, kdo je provozovatelem vesmíru, aby na něj mohl podat žalobu.
Dole je dopsáno: „P.S. Mám také stížnost na jeden župan. Ten už ví proč.“
"""
