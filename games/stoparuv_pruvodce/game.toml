„Ach, klasická pozice Grozzmara Vrozeného z Temné kolonie Bažichu.“

„Grozzmar tvrdil, že každý tvor se rodí se zlem velikosti zhruba jednoho hrášku, uloženým pod levou lopatkou.
Celý život se ho pokoušel najít. Rozpitval kvůli tomu čtyři tisíce dobrovolníků, ale hrášek nenašel.
Usoudil z toho, že zlo je neviditelné, a tudíž ještě nebezpečnější, než předpokládal.“

„Sám byl přitom nejhodnějším tvorem své generace. Pomáhal starým planetám přes ulici, krmil osiřelé komety.
Považoval to za nejsilnější důkaz své teorie: tak dokonale své zlo potlačoval. Až na ty čtyři tisíce
dobrovolníků, samozřejmě.“

„Zajímavá pozice. Mylná, ale zajímavá.“
