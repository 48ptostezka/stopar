Magrathea je legendární planeta, která byla v dávných dobách— Aha, počkat, vy myslíte tu druhou Magratheu.

Ehm... Tak znova... Magrathea je malá chovatelská stanice habešských koček.
Habešské kočky jsou proslulé svou inteligencí. Není jasné, zda slavně či neslavně.
