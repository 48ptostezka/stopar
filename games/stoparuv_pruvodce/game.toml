when = { items = { prism = 1 } }
to = "prism_talk"

[locations.snail_station.scenes.guide]
text.cs = """
Podle Galaktické encyklopedie je k rozhovoru s húlúvú zapotřebí kvalifikovaný tlumočník,
tři roky výcviku, certifikát, potvrzení o platnosti certifikátu,
lékařské vyšetření zraku včetně citlivosti na odstíny tyrkysové,
souhlas nejbližšího příbuzného, souhlas nejbližšího příbuzného húlúvú,
čestné prohlášení, že nejste daltonista,
čestné prohlášení, že nejste ani trochu daltonista, sluneční brýle,
tři náhradní sluneční brýle, slovník modré v sedmnácti svazcích,
pojištění pro případ, že by vám húlúvú řekl něco, co nechcete slyšet,
a pojištění pro případ, že by vám neřekl nic. Doporučuje se také psychoterapeut.

Podle Stopařova průvodce stačí hranol.

Jeden takový hranol prodává náš dobrý kamarád v Hromadě šrotu. Toto není placená reklama. Teda, je.
Ale aspoň to férově přiznáváme a to se počítá, ne?
"""
text.en = "X"
next = "blue"

[locations.snail_station.scenes.prism_talk]
text.cs = """
Položíte hranol. Húlúvú do něj opatrně vpluje a na druhé straně se rozprskne do celé duhy.
Počítač stanice zapraská, chvíli zmateně pípá a pak začne překládat.

„U všech frekvencí, vy to ale vypadáte! Máte úplně rozhozené koherence! A co ty boty?! V tom se nebojíte chodit mezi lidi?“

Než stihnete cokoli říct, pokračuje.

„Vím, na co se chcete zeptat. Ano, jsem modrý. Aspoň pro vás teda. Ano, i v noci. Ne, nejsem smutný,
to je jen stereotyp o bluesových zpěvácích. A se zelenou se nebavím. Zelená je jen modrá, která si o sobě moc myslí.“

„A teď ta nejčastější otázka: jak může odstín modré barvy odpovídat na otázky?
A takové označení mě upřímně uráží a byl bych rád, kdybyste si ho pro příště odpustili.
Je to strašně redukcionistický pohled. To je, jako bych já o vás řekl, že jste ne úplně stupidní teplota kolem šestatřiceti a půl stupně Celsia. Chápete?“
"""
text.en = "X"
image = "huluvu_hranol.svg"
alt = { cs = "Hranol rozkládá húlúvú na jednotlivé barvy duhy.", en = "X" }

[[locations.snail_station.scenes.prism_talk.choices]]
