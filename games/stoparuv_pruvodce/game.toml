text.cs = """
„Ach, klasická pozice Melisandry Tříkostelní, zakladatelky společenské kauzality.“

„Melisandra tvrdila, že zlo vzniká ve chvíli, kdy se sejdou alespoň tři bytosti. Dvě, aby se pohádaly,
a třetí, aby jim říkala, že to přece nemají řešit. Proto se odstěhovala na asteroid velikosti kuchyňského stolu
a žila tam úplně sama, dokonale dobrá a dokonale nesnesitelná.“

„Jednoho dne jí na asteroid spadl jiný filosof. Do týdne si navzájem napsali třináct svazků urážek.
Melisandra to považovala za potvrzení své teorie. Filosof za vyvrácení, protože byli jen dva.
Spor nikdy nevyřešili. Dodnes tam sedí, každý na jednom konci stolu. Teda, asteroidu.“

„Zajímavá pozice. Trochu přeplněná, ale zajímavá.“
"""
