to = "bathrobe"

[locations.discontented_nebula.scenes.dont_know]
text.cs = """
„Nevíte?“ Hromotluk smutně svěsí ramena. Pak se mu najednou rozsvítí oči. „A nechcete si na to stěžovat?“
"""
text.en = "X"
image = "hromotluk.svg"
alt = { cs = "Hromotluk Reklamač Sedmý se nad vámi sklání se stížností.", en = "X" }

[[locations.discontented_nebula.scenes.dont_know.choices]]
