[locations.toitoi]
code = "VSQL-3GHD"
name = { cs = "Veřejná toitoika uprostřed vesmíru", en = "X" }

[locations.toitoi.scenes.arrival]
text.cs = """
V místě, kde se kříží tři hyperprostorové dálnice, se vznáší modrá toitoika. Je to jediné veřejné WC
v okruhu dvanácti parseků. Na dveřích svítí nápis OBSAZENO. Svítí tam odjakživa.

Uvnitř totiž žije Nefron Urinox. Nikdo ho nikdy neviděl. Kdo chce toitoiku použít, musí s ním nejprve
vést filosofickou disputaci. Což je dvojnásob zákeřné: nejenže vás to zdrží od vykonání potřeby, ale ještě při tom musíte přemýšlet. Brr.

Zpoza dveří se ozve hluboký, lehce ozvěnou zastřený hlas. „Vítejte, poutníci. Posaďte se. Teda, ne sem.“
"""
