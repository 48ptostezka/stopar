otec se jednou málem stal šampionem, ale pak usnul na posuzovacím stole.“

Několik koček mezitím nehybně zírá na díru ve stěně.

„Myši,“ mávne rukou majitelka. „Kočky to dělají pořád.“

To určitě není nic zajímavého.
