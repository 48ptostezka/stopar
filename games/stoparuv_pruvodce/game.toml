[locations.lost_from_lost_and_found.scenes.arrival]
text.cs = """
Ztráty a nálezy ze Ztrát a nálezů jsou zhruba stotrilionkrát větší než obyčejné Ztráty a nálezy.
Končí tu všechno, co se ztratilo ze Ztrát a nálezů. Což znamená vlastně skoro všechno, co se kdy ztratilo.

Řídí je civilizace potomků turistů, kteří se ve Ztrátách a nálezech ztratili.
Ze stanů ze ztracených deštníků postupně vyrostla města i celé říše.
Docela jim to tu fungovalo, dokud někdo nevymyslel inventuru.

Vládne tu Antibogdanismus. Jeho věřící považují Bogdana
ze Ztrát a nálezů za strašlivého démona, který může za všechno jejich utrpení.
Což je vlastně docela pravda.

Antibogdanisté z principu nic neztrácejí. Všechno nosí přivázané provázkem k zápěstí,
takže se ulicemi sunou celé domácnosti, včetně skříní a babiček.

Co se děje s věcmi, které se ztratí i odsud, nikdo neví.
Antibogdanisté se ale bojí, že existují ještě větší Ztráty a nálezy,
kde trpí celé další civilizace.
"""
text.en = "X"
image = "ztraty_ztrat.svg"
alt = { cs = "Obyvatelé mají věci, na kterých jim záleží, přivázané provázkem k zápěstí.", en = "X" }
pick = "any"

