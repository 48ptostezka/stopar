Stanici v souhvězdí Pozpátku se pohybujícího šneka kdysi obývali húlúvú, superinteligentní odstíny modré.
Dnes je skoro prázdná. Možná vymřeli. Možná odešli. Možná jen vybledli. Kdo ví, co se jim honí... barvou.

Prostředek hlavní haly barví ten poslední z nich.
"""
text.en = "X"
image = "stanice_huluvu.svg"
alt = { cs = "Vesmírná stanice s posledním húlúvú.", en = "X" }
