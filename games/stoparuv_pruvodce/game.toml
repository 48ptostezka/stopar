[locations.planet_istvania.scenes.gifts]
text.cs = """
Na přistávací ploše vás čeká celá vládní delegace s květinami a transparentem.

„Vy jste sem přiletěli... jen tak? Bez důvodu? Dobrovolně?“ Starosta si utře slzu. „Za deset tisíc let jste první.“

Dostanete magnetku, hrnek a tričko s nápisem „Byli jsme tam“. Pak se celá delegace rozpačitě odmlčí, protože nikdo neví, co dál. Začne mrholit.

U odletové brány vám podají dotazník. Otázka číslo 1: „Proč jste přiletěli?“

Na Ištvánii není nic, co by stálo za to. Gratulujeme, zjistili jste to jako první.
"""
text.en = "X"
image = "istvanie_delegace.svg"
alt = { cs = "Na přistávací ploše na vás čeká vládní delegace s květinami a transparentem.", en = "X" }
give = { items = { magnet = 1, cup = 1, shirt = 1 }, clues = [
    "nothing_is_on_istvania",
] }

[locations.planet_istvania.scenes.arthur]
text.cs = """
Recepční hotelu U Zlatého kapra si vás změří pohledem a nalistuje knihu hostů.

„Arthur? Pozemšťan? Ne, žádný tu nebydlí. Nikdy nebydlel. A upřímně, kdo by tu bydlel dobrovolně?“

Vyjdete ven. Na náměstí vás obklopí dav místních a každý z nich Arthura dneska zaručeně viděl. Stačí zaplatit pět išcoinů.

Arthur na Ištvánii není.
"""
text.en = "X"
image = "istvanie_namesti.svg"
alt = { cs = "Na náměstí vás obklopí dav místních a každý z nich Arthura zaručeně viděl. Každý z nich někde úplně jinde.", en = "X" }
give = { clues = ["arthur_not_on_istvania"] }
next = "arrival"


[locations.planet_istvania.scenes.holy_items]
text.cs = """
Projdete sto čtyřicet obchodů se suvenýry. Hrnky, trička, magnetky, sněžítka s nápisem „Byl jsem tam“.
U posledního pultu se prodavač zamyslí.

„Bublifuk? Svěcené mýdlo? To tu nikdy nebylo. Ale mohu vám nabídnout magnetku s obrázkem mýdla. Nebo hrnek s nápisem Bublifuk.“

Bublifuk ani svěcené mýdlo tu nenajdete.
"""
text.en = "X"
image = "istvanie_suvenyry.svg"
alt = { cs = "Obchodník se suvenýry bublifuk a svěcené mýdlo nemá. Nabízí vám ale magnetku nebo hrnek.", en = "X" }
give = { clues = ["holy_items_not_on_istvania"] }
next = "arrival"

