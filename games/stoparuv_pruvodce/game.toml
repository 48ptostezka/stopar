[locations.discontented_nebula.scenes.arrival]
text.cs = """
Na okraji Nespokojené mlhoviny visí uvítací cedule: „Vítejte!“ A přímo pod ní další: „Stížnosti na uvítání podávejte u přepážky č. 3.“
U přepážky číslo 3 stojí fronta lidí, kteří si přišli stěžovat na frontu u přepážky číslo 3.

Místní si stěžují na mlhu. Pak na to, že mlha není dost mlhavá. Pak na sebe navzájem, že si pořád stěžují.
Ale kdo si nestěžuje, je podezřelý a ostatní si na něj stěžují.
"""
text.en = "X"
image = "mlhovina.svg"
alt = { cs = "Typická scéna ulice města Mlhoviňanů. Několik sousedů si na sebe vzájemně stěžuje. A nejvíc na toho, který si nestěžuje.", en = "X" }
