[locations.galactic_forum]
code = "4V4N-NTQC"
name = { cs = "Galaktické fórum", en = "X" }

[locations.galactic_forum.scenes.arrival]
text.cs = """
Galaktické fórum nahradilo galaktický internet poté, co vyšlo najevo, že ten drží pohromadě jen virtuální drát
a virtuální izolepa. Fórum je mnohem robustnější. Drží ho pohromadě skutečný drát a skutečná izolepa.

Přispět může kdokoli. Stačí napsat příspěvek na libovolný fyzický nosič a vložit ho do nejbližšího Bíblboxu.
Bíblboxy nemají nic společného s prezidentem Galaxie Zafodem Bíblbroxem. Jsou pojmenované po svém vynálezci
Zachodu Bíblbroxovi, který s prezidentem Galaxie také nemá nic společného. Do loňského května se jmenovaly
Zachodboxy, ale docházelo pak k nepříjemným omylům.
"""
text.en = "X"
image = "galakticke_forum.svg"
alt = { cs = "Galaktické fórum je vlastně spousta šrotu držená pohromadě drátem a izolepou. V popředí terminál.", en = "X" }
next = "terminal"

[locations.galactic_forum.scenes.terminal]
text.cs = """
U vchodu vás odchytí robot, usadí vás k terminálu a odspěchá dřív, než stihnete poděkovat. Denně usadí čtyři tisíce
návštěvníků. Na pozdravy nemá kapacitu.

Na obrazovce bliká kurzor. Pod ní jsou dvě tlačítka: modré a červené.
"""
text.en = "X"
image = "galakticke_forum.svg"
alt = { cs = "Galaktické fórum je vlastně spousta šrotu držená pohromadě drátem a izolepou. V popředí terminál.", en = "X" }
