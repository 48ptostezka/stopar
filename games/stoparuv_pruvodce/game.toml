[locations.discontented_nebula.scenes.complaint_filed]
text.cs = """
Hromotluk nadšeně vytáhne nový šanon a pečlivě píše.

„Stížnost číslo čtyři miliardy osm set dvanáct milionů tři sta čtyřicet tisíc devět set šedesát sedm:
Stěžovatelé nevědí, kam se posílají stížnosti.“

Šanon zaklapne a mile se na vás usměje. „Děkuji. Jaká krásná stížnost.“
"""
text.en = "X"
image = "hromotluk.svg"
alt = { cs = "Hromotluk Reklamač Sedmý se nad vámi sklání se stížností.", en = "X" }
next = "hromotluk"

[locations.discontented_nebula.scenes.bathrobe]
