# ---------------------------------- restaurant

[locations.restaurant]
code = "GCS6-XYZS"
name = { cs = "Restaurant na konci velice dlouhé uličky", en = "X" }

[locations.restaurant.scenes.arrival]
image = "restaurant.svg"
alt = { cs = "Restaurant na konci velice dlouhé uličky", en = "X" }
text.cs = """
Jak už název napovídá, Restaurant na konci velice dlouhé uličky leží na konci skutečně velmi dlouhé uličky.

Proto tam také davy návštěvníků určitě nemíří – snad jen ti, kteří si hospodu spletou s Restaurantem na konci vesmíru.

Takových je vlastně poměrně dost, a to navzdory skutečnosti, že na možnou záměnu upozorňuje výrazná cedule na začátku uličky.
Té si však nikdy nikdo nevšimne, neboť splývá se záplavou podobně výrazných cedulí propagujících zdravotní benefity
konzumace zelených fazolí nebo naopak lákajících návštěvníky do podniků pochybné kvality v okolí, ve kterých se žádné zelené fazole
rozhodně nekonzumují.

Jsou tu jen tři hosté a barman.
"""
text.en = "X"
pick = "any"


[[locations.restaurant.scenes.arrival.choices]]
id = "barman"
label = { cs = "Promluvit si s barmanem", en = "X" }
to = "barman"

[[locations.restaurant.scenes.arrival.choices]]
id = "host1"
label = { cs = "Promluvit si s hostem v rohu", en = "X" }
to = "host1"

[[locations.restaurant.scenes.arrival.choices]]
id = "host2"
label = { cs = "Promluvit si s hostem před barem", en = "X" }
to = "host2"

[[locations.restaurant.scenes.arrival.choices]]
id = "host3"
label = { cs = "Promluvit si s hostem v zadní části", en = "X" }
to = "host3"

[locations.restaurant.scenes.host1]
image = "bar_grumbold.svg"
alt = { cs = "Grumbold Pašt je vysloužilý doručovatel výpovědí.", en = "X" }
text.cs = """
V rohu restaurace sedí Grumbold Pašt, vysloužilý doručovatel výpovědí.

Vysvětlíte mu, že pátráte po jistém pozemšťanovi, kterého někdo unesl.

Grumbold se na vás trpce podívá: „Stalo se to ve vesmíru, že ano? A víte, kdo je ve vesmíru taky? Vogoni! Náhoda? Nemyslím si!“

Pak vám vysvětlí, že pokud Arthura skutečně nařídili unést Vogoni, určitě mají k žádosti o povolení únosu někde založený nějaký formulář.
Abyste se ale na formuláře mohli podívat, budete muset vyplnit žádost o přístup k žádostem. Zkuste Úřad.
"""
text.en = "X"
give = { clues = ["vogons"] }
next = "arrival"

[locations.restaurant.scenes.host2]
image = "bar_ilthenie.svg"
alt = { cs = "Ilthenie Vrrbl-Ka je cestovatelka a amatérská etnografka.", en = "X" }
text.cs = """
Přímo před barem sedí Ilthenie Vrrbl-Ka, cestovatelka a amatérská etnografka.

Vysvětlíte jí situaci ohledně únosu Arthura.

„Pozemšťan! Opravdový? Je pravda, že mají jenom dvě oči a stačí jim to?“ začne okamžitě Ilthenie. Pak vzrušeně vypískne: „Počkejte, vy jste taky pozemšťané?!“

„Já bych na ten váš únos tipovala Společnost pro ochranu ohrožených druhů. Oni sbírají všechno, co je vzácné. Mě taky jednou chytili, když jsem zrovna měla hroznou vyrážku. Mysleli si, že jsem nový podruh galaktického rakokopytníka. Hrůza.“

Když se máte k odchodu, zavolá za vámi, zápisník v ruce: „Tak počkejte přece, já mám na vás strašně moc otázek!“
"""
text.en = "X"
give = { clues = ["society"] }
next = "arrival"

[locations.restaurant.scenes.host3]
image = "bar_svorc.svg"
alt = { cs = "Odpadlík od Kultu Velké Mýdlové Bubliny, Bratr Švorc, ukazuje na své holé levé chodidlo.", en = "X" }
text.cs = """
V zadní části restaurace sedí Bratr Švorc, odpadlík od Kultu Velké Mýdlové Bubliny.
To ‚Bratr‘ je jméno. A taky příjmení. A vlastně i titul. ‚Švorc‘ naopak vyjadřuje Bratrovy současné majetkové poměry.
Přijde mu to tak důležité, že to píše s velkým Š.

Zeptáte se ho, jestli náhodou neví něco o únosu Arthura.

„Nevím, co jste už slyšeli, ale já bych tohle tipoval na práci Kultu Velké Mýdlové Bubliny. Když jsem od nich odcházel, unesli moji levou ponožku,“ ukáže Bratr na své levé chodidlo, kde nápadně chybí ponožka.

„Zkuste navštívit některý z chrámů Kultu, třeba na planetě Bubliblaxie.“
"""
text.en = "X"
give = { clues = ["cult"] }
set = ["cult_allow_help"]
next = "arrival"

[locations.restaurant.scenes.barman]
image = "bar_ottokar.svg"
alt = { cs = "Za barem stojí čtyřruký barman Ottokar Zvrnk s knírem na každé ze svých dvou hlav.", en = "X" }
text.cs = """
Za barem stojí čtyřruký barman s knírem na každé ze svých dvou hlav. Ottokar Zvrnk.

„Vítejte v Restauraci na konci velice dlouhé uličky. Ano, uličky. Ne vesmíru. Uličky. Čtěte ceduli.“

Vyzve vás, abyste se usadili na barové stoličky.

„Co si dáte? Nemám tady ten slavný megacloumák, který se všem tak líbí. Mám něco lepšího. Hvězdný Zakašlák. Nejlepší drink ve vesmíru. Nebo aspoň v této uličce, což je statisticky podobné.“

Popíšete všechno, co víte ohledně únosu Arthura.

„Ach tak. Tak s tím vám bohužel nepomohou. Tohle zavání problémy... Ale počkejte...“

Nakloní se k vám a změří si vás pohledem. Teda, pohledy.

„Vy vypadáte jako stopaři. Je to tak?“
"""
text.en = "X"
pick = "one"

[[locations.restaurant.scenes.barman.choices]]
id = "barman_yes"
label = { cs = "Ano, jsme stopaři", en = "X" }
to = "barman_yes"

[[locations.restaurant.scenes.barman.choices]]
id = "barman_no"
label = { cs = "Ne, rozhodně nejsme stopaři", en = "X" }
to = "barman_no"

[locations.restaurant.scenes.barman_yes]
image = "bar_ottokar.svg"
alt = { cs = "Za barem stojí čtyřruký barman Ottokar Zvrnk s knírem na každé ze svých dvou hlav.", en = "X" }
text.cs = """
