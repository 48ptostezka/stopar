label = { cs = "Nevíte, kdo unesl Arthura Denta?", en = "X" }
to = "missing_second"


[locations.snail_station.scenes.missing_second]
text.cs = """
„No jistě. Byli to...“ Počítač mlčí a na obrazovku tiskne jen spoustu teček.

„To je zvláštní,“ pokračuje po chvíli húlúvú. „Přesně v okamžiku, kdy byl Arthur unesen, zmizela z kontinua vesmíru jedna minuta.
Vím, co se stalo před ní. Vím, co se stalo po ní. Ale ta podstatná část únosu se stala přesně v ní. Je to, jako by vám
z detektivky někdo vytrhl stránku s odhalením vraha.“

„Na vašem místě bych se podíval do Ztrát a nálezů. Minuty se ztrácejí častěji, než si myslíte. Většinou v noci na sobotu.“
"""
text.en = "X"
image = "huluvu_hranol.svg"
alt = { cs = "Hranol rozkládá húlúvú na jednotlivé barvy duhy.", en = "X" }
