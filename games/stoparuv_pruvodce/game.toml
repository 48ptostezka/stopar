# ---------------------------------- junk heap

[locations.junk_heap]
code = "64ZE-ZMQH"
name = { cs = "Hromada šrotu", en = "X" }

[locations.junk_heap.scenes.arrival]
text.cs = """
Planeta Kalobahno Supreme 9000 dostala jméno podle prvního průzkumníka,
který přistál přímo do jediné louže na celém povrchu. Zbytek planety je nádherný.

Nejkrásnější je vesnička Hromada šrotu.
Je tak malebná, že ji malíři odmítají malovat, protože by jim to nikdo nevěřil.
Ptáci tu zpívají ve čtyřhlasé harmonii a potok jim dělá rytmický doprovod, a jediný kus šrotu v celé vesnici,
jeden rezavý šroubek, je vystavený v místním muzeu pod neprůstřelným sklem.

Turisté sem jezdí hlavně kvůli jménu. Odjíždějí zklamaní a píšou rozhořčené recenze:
„Slibovali hromadu šrotu, dostali jsme rozkvetlou louku. Jedna hvězdička.“
"""
text.en = "X"
image = "hromada_srotu.svg"
alt = { cs = "Malebná vesnička Hromada šrotu na planetě Kalobahno Supreme 9000.", en = "X" }
pick = "any"

[[locations.junk_heap.scenes.arrival.paragraphs]]
when = { clues = ["need_prism"], without_items = ["prism"] }
text.cs = """
Ve výloze malého obchůdku visí cedule:

Hranol. Skoro nový.

Přeškrtnuto.

5 let starý.

Přeškrtnuto.

10 let starý.

Přeškrtnuto.

20 let starý.

Přeškrtnuto.

Vintage. Cena dohodou.
"""
text.en = "X"

[[locations.junk_heap.scenes.arrival.choices]]
id = "shop"
label = { cs = "Zajít do obchodu s hranolem", en = "X" }
when = { clues = ["need_prism"], without_items = ["prism"] }
to = "shop"

[locations.junk_heap.scenes.shop]
text.cs = """
Starý prodavač stojí za pultem a nevěřícně počítá kredity.
Za čtyřicet let prodal přesně jeden hranol, jiný nikdy neměl.
Přesto si na něj celou dobu platil reklamu ve Stopařově průvodci,
a možná i díky němu je Průvodce o něco levnější než Galaktická encyklopedie.

Kupcem je stopař v šortkách a žabkách s ručníkem kolem ramen. Nic jiného s sebou nemá.

Prodavač mu nabídne tašku.
„Taška je jen zodpovědnost s uchy,“ odmítne ji stopař.
Prodavač mu nabídne účtenku.
„A účtenka je zodpovědnost na papíře.“

Když prodavač zjistí, že jste pro hranol přišli taky, upustí peníze.
Dva kupci během jedné minuty jsou méně pravděpodobní, než že vás trefí meteorit. Dvakrát. Tentýž.
Galaktický statistický úřad proto na místo okamžitě vyslal inspektora náhodnosti.
Toho však cestou trefil meteorit. Dvakrát. Tentýž.

Zefyr si hranol nejistě prohlíží proti světlu, jako by teprve teď pochopil, že si ho vlastně bude muset odnést.

„Vedu si statistiku nákupů,“ ozve se prodavač. „Mohl bych se zeptat, proč jste si pro nákup hranolu vybral právě můj obchod?“

Zefyr pokrčí rameny. „Šel jsem kolem.“

Prodavač si to pečlivě zapíše. Podle jeho statistiky teď sto procent zákazníků jen šlo kolem.
"""
text.en = "X"
image = "hromada_srotu_obchod.svg"
alt = { cs = "Obchůdek, kde Zefyr Klakuflonk, oděn pouze v šortkách a ručníku, právě koupil 40 let neprodaný hranol.", en = "X" }
pick = "any"

[[locations.junk_heap.scenes.shop.choices]]
id = "towel"
label = { cs = "Ukázat ručník", en = "X" }
when = { items = { towel = 1 }, without_items = ["prism"] }
give = { items = { prism = 1 } }
to = "towel"

[[locations.junk_heap.scenes.shop.choices]]
id = "ask"
label = { cs = "Poprosit o hranol", en = "X" }
when = { without_items = [
    "towel",
    "prism",
], without_clues = [
    "tuesday_prophecy",
] }
give = { clues = ["ask_oracle"] }
to = "no_towel"

[[locations.junk_heap.scenes.shop.choices]]
id = "prophecy"
label = { cs = "Vyřídit předpověď věštkyně", en = "X" }
when = { clues = ["tuesday_prophecy"], without_items = ["prism"] }
give = { items = { prism = 1 } }
to = "prophecy"

[locations.junk_heap.scenes.towel]
text.cs = """
Zefyr si váš ručník uznale prohlédne. „Kdo má ručník, ten ví, co dělá. A určitě má i kartáček na zuby, mýdlo,
krabičku sušenek, mapu, klubko provázku, repelent a pláštěnku.“ Otřese se. „Tolik zodpovědnosti.“

Pak vám s viditelnou úlevou vtiskne hranol do ruky. „S tím vším už vám jeden hranol nebude vadit.“
"""
text.en = "X"
image = "hromada_srotu_obchod.svg"
alt = { cs = "Obchůdek, kde Zefyr Klakuflonk, oděn pouze v šortkách a ručníku, právě koupil 40 let neprodaný hranol.", en = "X" }

[locations.junk_heap.scenes.no_towel]
text.cs = """
Zefyr se na vás zděšeně podívá. „Vy nemáte ručník? Vůbec? Ani malý?“

Nervózně přešlápne. Hranol vlastní zhruba dvě minuty a už teď se cítí, jako by vlastnil nemovitost.
Rád by se ho zbavil. Jenže rozhodnout, jestli ho vlastnit, je pro něj skoro horší než ho vlastnit.

„Víte co? Zeptejte se Věštkyně úterků, jestli budu mít v úterý hranol. Ať si s tím poradí ona.“
"""
text.en = "X"
image = "hromada_srotu_obchod.svg"
alt = { cs = "Obchůdek, kde Zefyr Klakuflonk, oděn pouze v šortkách a ručníku, právě koupil 40 let neprodaný hranol.", en = "X" }


[locations.junk_heap.scenes.prophecy]
text.cs = """
„Jen to co vždycky? Hranol mít nebudu?“ Zefyrovi se viditelně uleví. „No, proti osudu nic nezmůžu.“

Podá vám hranol a odchází výrazně lehčím krokem.
"""
text.en = "X"
image = "hromada_srotu_obchod.svg"
alt = { cs = "Obchůdek, kde Zefyr Klakuflonk, oděn pouze v šortkách a ručníku, právě koupil 40 let neprodaný hranol.", en = "X" }

# ---------------------------------- tuesday oracle
[locations.tuesday_oracle]
code = "P5H8-FR9S"
name = { cs = "Věštkyně úterků", en = "X" }

[locations.tuesday_oracle.scenes.arrival]
text.cs = """
Věštkyně úterků je nejpřesnější věštkyně v Galaxii. Za dvě stě let se spletla jen jednou.
Sama říká, že tajemství jejího úspěchu je prosté: předpovídá výhradně úterky.

Ostatní věštci předpovídají celý týden, a proto se tak často pletou.
Věštkyně úterků je specialistka: má sedmiletou atestaci z úterků
a dvouletou nástavbu z úterních odpolední. Středy ji naopak pokaždé zaskočí.

Úterý, ve kterém se tenkrát spletla, se dodnes vede jako pohřešované.
Odborníci se proto přou, jestli Věštkyně úterků vidí budoucnost, nebo jestli se jí úterky prostě bojí odporovat.
"""
