  <!-- vůně koláče -->
  <g fill="none" stroke="#ffc266" stroke-opacity=".5" stroke-width="2" stroke-dasharray="10 5" stroke-linecap="round"><path d="M80 176 q-8 -14 0 -28 q8 -14 0 -28 q-8 -14 0 -28"/><path d="M100 170 q-8 -14 0 -28 q8 -14 0 -28"/><path d="M440 166 q-6 -12 0 -24 q6 -12 0 -24"/></g>
  <!-- prachový vír -->
