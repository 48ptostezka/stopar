  <g fill="#fff"><circle cx="34" cy="28" r="1.2"/><circle cx="150" cy="18" r="1"/><circle cx="230" cy="44" r="1.3"/><circle cx="330" cy="22" r="1"/><circle cx="440" cy="40" r="1.2"/><circle cx="270" cy="96" r="0.9"/><circle cx="20" cy="110" r="0.9"/></g>
  <!-- měsíce Bublaniny -->
  <circle cx="392" cy="62" r="16" fill="#ff5a36"/><circle cx="386" cy="56" r="4" fill="#ff8a6a"/>
  <path d="M394 46 Q398 34 410 30" fill="none" stroke="#0e9c8e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="430" cy="92" r="6" fill="#8a73ee"/>
  <!-- vzdálené duny -->
  <path d="M0 176 Q60 154 130 168 Q210 146 300 166 Q390 150 480 170 V186 H0Z" fill="#2a2c62"/>
