  <circle cx="240" cy="40" r="0" fill="none"/>
  <!-- stoličky -->
  <rect x="120" y="244" width="50" height="10" rx="5" fill="#8a73ee"/><rect x="310" y="244" width="50" height="10" rx="5" fill="#8a73ee"/>
  <path d="M145 254 V280 M335 254 V280" stroke="#23275e" stroke-width="5"/>
