  <!-- bar -->
  <rect x="0" y="196" width="480" height="40" fill="#595d82"/>
  <rect x="0" y="186" width="480" height="12" rx="3" fill="#6f739b"/>
  <g stroke="#4c5074" stroke-width="3"><path d="M120 204 V232"/><path d="M360 204 V232"/></g>
