    <path d="M269 151 V158 M263 158 H275" stroke="#caccdc" stroke-width="2" stroke-linecap="round"/>
    <path d="M269 124 l2 5 l5 1 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -1Z" fill="#f0a400"/>
