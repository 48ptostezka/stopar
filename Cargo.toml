[workspace]
resolver = "2"
members = ["core", "app", "tools/codes"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
# preserve_order keeps tables in file order (the inventory shows items in that order).
toml = { version = "1", features = ["preserve_order"] }

# Small, fast WebAssembly for phones.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
